<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملاحظات</title>
<style>
    /* =========================
   Reset
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #0c0c0c;
    color: #fff;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
}


/* =========================
   Sidebar
========================= */

.sidebar {
    width: 240px;
    min-width: 240px;
    height: 100vh;

    background: #121212;
    border-left: 1px solid #222;

    padding: 20px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-weight: bold;
    font-size: 1.2rem;

    margin-bottom: 30px;

    display: flex;
    align-items: center;
    gap: 10px;
}

.nav-section {
    margin-bottom: 25px;

    color: #888;

    font-size: 0.75rem;

    text-transform: uppercase;
}

.nav-item {
    display: block;

    padding: 11px;

    color: #fff;

    text-decoration: none;

    border-radius: 8px;

    margin-bottom: 5px;

    transition: .25s;
}

.nav-item:hover {
    background: #1f1f1f;
}

.nav-item.active {
    background: #2a2a2a;
}


/* =========================
   Main Container
========================= */

.container {
    flex: 1;

    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    padding: 35px;

    overflow-y: auto;

    min-width: 0;
}


/* =========================
   Header
========================= */

.header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 30px;
}

.header h1 {
    font-size: 30px;

    margin-bottom: 6px;
}

.header p {
    color: #888;

    font-size: 14px;
}


/* =========================
   Add Button
========================= */

.header button {
    background: #2563eb;

    color: white;

    border: none;

    padding: 12px 18px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 14px;

    transition: .25s;

    white-space: nowrap;
}

.header button:hover {
    background: #1d4ed8;

    transform: translateY(-2px);
}

.header button:active {
    transform: scale(.97);
}


/* =========================
   Search
========================= */

.search {
    display: flex;

    align-items: center;

    gap: 10px;

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 12px;

    padding: 13px 15px;

    margin-bottom: 25px;

    transition: .25s;
}

.search:focus-within {
    border-color: #2563eb;

    box-shadow: 0 0 0 3px #2563eb18;
}

.search i {
    color: #777;

    font-size: 15px;
}

.search input {
    flex: 1;

    width: 100%;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-size: 15px;
}

.search input::placeholder {
    color: #666;
}


/* =========================
   Notes Grid
========================= */

.notes {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));

    gap: 20px;
}


/* =========================
   Note Card
========================= */

.note {
    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 14px;

    padding: 20px;

    min-width: 0;

    display: flex;

    flex-direction: column;

    min-height: 190px;

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.note:hover {
    transform: translateY(-5px);

    border-color: #2563eb;

    box-shadow:
        0 15px 35px rgba(0, 0, 0, .25);
}


/* Title */

.note h3 {
    font-size: 18px;

    margin-bottom: 12px;

    line-height: 1.5;

    overflow-wrap: anywhere;
}


/* Text */

.note p {
    color: #aaa;

    line-height: 1.7;

    font-size: 14px;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    flex: 1;

    min-height: 65px;
}


/* =========================
   Note Bottom
========================= */

.bottom {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-top: 20px;

    padding-top: 15px;

    border-top: 1px solid #252a31;
}

.bottom small {
    color: #777;

    white-space: nowrap;
}


/* =========================
   Actions
========================= */

.actions {
    display: flex;

    align-items: center;

    gap: 7px;
}

.bottom button {
    width: 36px;

    height: 36px;

    border: none;

    border-radius: 9px;

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: .2s;

    font-size: 15px;
}

.bottom button:hover {
    transform: translateY(-2px);
}

.bottom button:active {
    transform: scale(.92);
}


/* Pin */

.pin {
    background: #374151;
}

.pin:hover {
    background: #4b5563;
}


/* Pinned */

.completed {
    background: #2563eb;
}

.completed:hover {
    background: #1d4ed8;
}


/* Delete */

.delete {
    background: #dc2626;
}

.delete:hover {
    background: #b91c1c;
}


/* =========================
   Modal
========================= */

.modal {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, .72);

    backdrop-filter: blur(5px);

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 9999;
}


/* Modal Box */

.modal-content {
    width: 450px;

    max-width: 100%;

    max-height: 90vh;

    overflow-y: auto;

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 16px;

    padding: 25px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, .5);

    animation: modalIn .2s ease;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* Modal Title */

.modal-content h2 {
    font-size: 22px;

    margin-bottom: 20px;
}


/* Inputs */

.modal-content input,
.modal-content textarea,
.modal-content select {
    width: 100%;

    margin-bottom: 15px;

    padding: 13px;

    background: #0d1117;

    border: 1px solid #2d333b;

    color: white;

    border-radius: 9px;

    outline: none;

    font-family: inherit;

    font-size: 14px;

    transition: .2s;
}

.modal-content input:focus,
.modal-content textarea:focus,
.modal-content select:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px #2563eb18;
}

.modal-content input::placeholder,
.modal-content textarea::placeholder {
    color: #666;
}


/* Textarea */

.modal-content textarea {
    resize: vertical;

    min-height: 110px;

    line-height: 1.6;
}


/* Select */

.modal-content select {
    cursor: pointer;
}

.modal-content option {
    background: #161b22;

    color: white;
}


/* =========================
   Modal Buttons
========================= */

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 5px;
}

.modal-buttons button {
    border: none;

    padding: 12px 20px;

    border-radius: 9px;

    cursor: pointer;

    font-family: inherit;

    font-size: 14px;

    transition: .2s;
}

#cancel {
    background: #333;

    color: white;
}

#cancel:hover {
    background: #444;
}

#saveTask {
    background: #2563eb;

    color: white;
}

#saveTask:hover {
    background: #1d4ed8;
}


/* =========================
   Empty State
========================= */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 60px 20px;

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 14px;

    color: #777;
}

.empty h3 {
    color: #aaa;

    margin-top: 12px;

    margin-bottom: 5px;
}

.empty p {
    font-size: 14px;
}


/* =========================
   Loading Screen
========================= */

#loading-screen {
    position: fixed;

    inset: 0;

    background: #0c0c0c;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 99999;

    transition: .4s;
}

.loader-logo {
    text-align: center;
}

.loader-circle {
    width: 65px;

    height: 65px;

    border-radius: 50%;

    border: 4px solid #232323;

    border-top-color: #3b82f6;

    animation: spin 1s linear infinite;

    margin: auto;

    margin-bottom: 22px;
}

.loader-logo h2 {
    font-size: 26px;

    margin-bottom: 8px;
}

.loader-logo p {
    color: #888;

    font-size: 14px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

#loading-screen.hide {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================
   Scrollbar
========================= */

::-webkit-scrollbar {
    width: 0;
    height: 0;
}

* {
    scrollbar-width: none;
}


/* =========================
   📱 Mobile
========================= */

@media (max-width: 768px) {

    body {
        display: block;

        min-height: 100vh;

        padding-bottom: 70px;
    }


    /* Sidebar */

    .sidebar {
        position: fixed;

        bottom: 0;
        left: 0;
        right: 0;

        width: 100%;
        min-width: 0;

        height: 65px;

        padding: 6px;

        display: flex;

        align-items: center;

        justify-content: space-around;

        background: #121212;

        border: none;

        border-top: 1px solid #292929;

        z-index: 5000;
    }


    .logo,
    .nav-section {
        display: none;
    }


    .nav-item {
        flex: 1;

        margin: 0 2px;

        padding: 9px 4px;

        text-align: center;

        font-size: 0;

        border-radius: 10px;
    }


    /*
       نخلي الإيموجي ظاهر
    */

    .nav-item::first-letter {
        font-size: 20px;
    }


    .nav-item.active {
        background: #2563eb22;
    }


    /* Container */

    .container {
        width: 100%;

        padding: 20px 13px 30px;

        margin: 0;
    }


    /* Header */

    .header {
        flex-direction: column;

        align-items: stretch;

        gap: 15px;

        margin-bottom: 20px;
    }


    .header h1 {
        font-size: 24px;
    }


    .header p {
        font-size: 13px;
    }


    .header button {
        width: 100%;

        padding: 13px;
    }


    /* Search */

    .search {
        margin-bottom: 18px;

        padding: 12px;
    }


    /* Notes */

    .notes {
        grid-template-columns: 1fr;

        gap: 12px;
    }


    .note {
        padding: 16px;

        border-radius: 13px;

        min-height: 175px;
    }


    .note:hover {
        transform: none;

        box-shadow: none;
    }


    .note h3 {
        font-size: 17px;
    }


    .note p {
        font-size: 14px;

        min-height: 60px;
    }


    /* Modal */

    .modal {
        padding: 12px;

        align-items: flex-end;
    }


    .modal-content {
        width: 100%;

        max-height: 88vh;

        padding: 20px;

        border-radius: 18px 18px 12px 12px;
    }


    .modal-content h2 {
        font-size: 20px;
    }


    /*
       16px مهم في الموبايل
       عشان iPhone ما يعملش Zoom
    */

    .modal-content input,
    .modal-content textarea,
    .modal-content select {
        font-size: 16px;

        padding: 13px;
    }


    .modal-buttons {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 8px;
    }


    .modal-buttons button {
        width: 100%;

        padding: 13px;
    }
}


/* =========================
   📱 Small Phones
========================= */

@media (max-width: 400px) {

    .container {
        padding-left: 10px;

        padding-right: 10px;
    }


    .header h1 {
        font-size: 22px;
    }


    .note {
        padding: 14px;
    }


    .bottom {
        align-items: flex-start;

        flex-direction: column;

        gap: 12px;
    }


    .actions {
        width: 100%;
    }


    .bottom button {
        flex: 1;

        width: auto;
    }
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>
<body>
<aside class="sidebar">
    <div class="logo">🏠 التنظيم</div>

    <div class="nav-section">عام</div>

    <a class="nav-item" href="./index.html">🏠 الشاشة الرئيسية</a>
    <a class="nav-item" href="./tasks.html">📋 المهام</a>
    <a class="nav-item active">📝 الملاحظات</a>
 
</aside>
<div class="container">
<div id="loading-screen">
    <div class="loader-logo">
        <div class="loader-circle"></div>
        <h2>نظام التنظيم</h2>
        <p>جاري تحميل البيانات</p>
    </div>
</div>
    <div class="header">

        <div>
            <h1>📝 الملاحظات</h1>
            <p>احتفظ بأفكارك وملاحظاتك.</p>
        </div>

        <button id="openModal">
            <i class="fa-solid fa-plus"></i>
            ملاحظة جديدة
        </button>

    </div>

    <div class="search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        placeholder="ابحث عن ملاحظة">

    </div>

    <div class="notes" id="notes">

        <div class="note">

            <h3>💡 فكرة مشروع</h3>

            <p>
                إنشاء Dashboard لإدارة الحياة الشخصية.
            </p>

            <div class="bottom">

                <small>18 يوليو</small>

                <div>

                    <button class="edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="pin">
                        <i class="fa-solid fa-thumbtack"></i>
                    </button>

                    <button class="delete">
                        <i class="fa-solid fa-trash"></i>
                    </button>

                </div>

            </div>

        </div>

        <div class="note">

            <h3>📚 مذاكرة</h3>

            <p>
                مراجعة Express و MongoDB.
            </p>

            <div class="bottom">

                <small>17 يوليو</small>

                <div>

                    <button class="edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <button class="delete">
                        <i class="fa-solid fa-trash"></i>
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="modal" id="modal">

        <div class="modal-content">

            <h2>إضافة مهمة جديدة</h2>

            <input
                id="title"
                type="text"
                placeholder="عنوان الملاحظه">

            <textarea
                id="description"
                placeholder="محتوي الملاحظه"></textarea>

            <select id="priority">

                <option value="📚">دراسه</option>

                <option value="💡">مشروع</option>

                <option value="📃">كلام</option>
                <option value="">غير ذالك</option>

            </select>

            

            <div class="modal-buttons">

                <button id="cancel">
                    إلغاء
                </button>

                <button id="saveTask">
                    حفظ المهمة
                </button>

            </div>

        </div>

    </div>
<script src="db.js"></script>
<script>
    let notes = [];

const modal = document.getElementById("modal");
const openModal = document.getElementById("openModal");
const cancel = document.getElementById("cancel");
const saveTask = document.getElementById("saveTask");


// =========================
// Modal
// =========================

openModal.onclick = () => {
    modal.style.display = "flex";
};

cancel.onclick = () => {
    modal.style.display = "none";
};


// =========================
// تحميل الملاحظات
// =========================

async function getNotes() {

    notes = await getAll("notes");

    renderNotes();
}


// =========================
// عرض الملاحظات
// =========================

function renderNotes() {

    const container =
        document.getElementById("notes");

    container.innerHTML = "";


    if (notes.length === 0) {

        container.innerHTML = `
            <div class="empty">
                📝
                <h3>لا توجد ملاحظات</h3>
                <p>أضف أول ملاحظة لك.</p>
            </div>
        `;

        return;
    }


    notes.forEach((note, index) => {

        const pinned =
            localStorage.getItem("pin") === note.title;


        container.innerHTML += `

            <div class="note">

                <h3>
                    ${escapeHTML(note.title)}
                </h3>

                <p>
                    ${escapeHTML(note.text)}
                </p>


                <div class="bottom">

                    <small>
                        ${note.date || ""}
                    </small>


                    <div class="actions">

                        <button
                            class="${pinned ? "completed" : "pin"}"
                            onclick="pinNote('${escapeAttribute(note.title)}')">

                            📌

                        </button>


                        <button
                            class="delete"
                            onclick="deleteNote(${index})">

                            🗑

                        </button>

                    </div>

                </div>

            </div>
        `;
    });
}


// =========================
// إضافة ملاحظة
// =========================

saveTask.onclick = async () => {

    let title =
        document.getElementById("title").value.trim();

    const text =
        document.getElementById("description").value.trim();

    const priority =
        document.getElementById("priority").value;


    if (!title) return;


    title = `${priority} ${title}`;


    await addItem("notes", {

        title,

        text,

        date: new Date().toLocaleDateString("ar-EG"),

        createdAt: new Date().toISOString()

    });


    modal.style.display = "none";


    document.getElementById("title").value = "";
    document.getElementById("description").value = "";


    await getNotes();
};


// =========================
// حذف
// =========================

async function deleteNote(index) {

    const note = notes[index];

    await deleteItem("notes", note.id);

    if (localStorage.getItem("pin") === note.title) {
        localStorage.removeItem("pin");
    }

    await getNotes();
}


// =========================
// تثبيت
// =========================

function pinNote(title) {

    localStorage.setItem("pin", title);

    renderNotes();
}


// =========================
// حماية HTML
// =========================

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function escapeAttribute(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


// =========================
// تشغيل
// =========================

window.addEventListener("load", async () => {

    await openDB();

    await getNotes();

    setTimeout(() => {

        document
            .getElementById("loading-screen")
            .classList.add("hide");

    }, 300);

});
</script>

</body>
