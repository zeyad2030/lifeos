<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>LifeOS - نظام الإنتاجية الذكي</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="app">
  <!-- القائمة الجانبية / التنقل -->
  <aside class="sidebar">
   <div class="brand">
    <h2>⚡ LifeOS</h2>
    <div class="small muted" id="date"></div>
   </div>
   <nav class="nav">
    <button class="active" data-page="dashboard">🏠 لوحة التحكم</button>
    <button data-page="study">📚 المذاكرة والمهام</button>
    <button data-page="timer">⏱️ مؤقت التركيز</button>
    <button data-page="english">🇬🇧 تعلم الإنجليزي</button>
    <button data-page="gaming">🎮 نظام اللعب</button>
    <button data-page="settings">⚙️ الإعدادات</button>
   </nav>
   <div class="sidebar-footer">
    <button class="btn ghost" id="exportTop">تصدير البيانات</button>
    <button class="btn danger ghost" id="resetTop">إعادة ضبط</button>
   </div>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main">
   <header class="header">
    <h1 id="title">لوحة التحكم</h1>
    <div class="user-info">أهلاً بك يا بطل! 🚀</div>
   </header>

   <div class="content" id="content">
    <!-- ديناميكي بواسطة JavaScript -->
   </div>
  </main>
 </div>

 <!-- رسائل التنبيه (Toast) -->
 <div id="toast" class="toast"></div>

 <script src="script.js"></script>
</body>
</html>
