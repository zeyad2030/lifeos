<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المهام</title>

    

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Segoe UI", Tahoma, sans-serif;

    background: #0c0c0c;

    color: #fff;

    min-height: 100vh;

    overflow-x: hidden;
}


/* =========================
   Sidebar
========================= */

.sidebar {

    width: 240px;
    min-width: 240px;

    height: 100vh;

    position: fixed;

    top: 0;
    right: 0;

    padding: 20px;

    background: #121212;

    border-left: 1px solid #222;

    z-index: 1000;

    overflow-y: auto;
}

.logo {

    font-weight: bold;

    font-size: 1.2rem;

    margin-bottom: 30px;

    display: flex;

    align-items: center;

    gap: 10px;
}

.nav-section {

    margin-bottom: 12px;

    color: #888;

    font-size: .75rem;
}

.nav-item {

    display: block;

    padding: 10px 12px;

    color: #fff;

    text-decoration: none;

    border-radius: 8px;

    margin-bottom: 5px;

    transition: .25s;
}

.nav-item:hover {

    background: #1f1f1f;

}

.nav-item.active {

    background: #2a2a2a;

}


/* =========================
   Container
========================= */

.container {

    width: calc(100% - 240px);

    margin-right: 240px;

    min-height: 100vh;

    padding: 30px;

}


/* =========================
   Header
========================= */

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;

    gap: 20px;
}

header h1 {

    font-size: 32px;

    margin-bottom: 5px;

}

header p {

    color: #888;

}


/* =========================
   Add Button
========================= */

#openModal {

    background: #2563eb;

    color: #fff;

    border: none;

    padding: 14px 20px;

    border-radius: 10px;

    cursor: pointer;

    transition: .3s;

    font-size: 15px;

    white-space: nowrap;
}

#openModal:hover {

    background: #1d4ed8;

}


/* =========================
   Statistics
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 20px;

    margin-bottom: 30px;
}

.stat-card {

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 12px;

    padding: 20px;
}

.stat-card span {

    color: #888;

}

.stat-card h2 {

    margin-top: 12px;

    font-size: 35px;

}


/* =========================
   Search
========================= */

.search-box {

    display: flex;

    align-items: center;

    gap: 10px;

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 10px;

    padding: 12px 15px;

    margin-bottom: 20px;
}

.search-box input {

    flex: 1;

    min-width: 0;

    background: none;

    border: none;

    outline: none;

    color: white;

    font-size: 15px;
}


/* =========================
   Filters
========================= */

.filters {

    display: flex;

    gap: 10px;

    margin-bottom: 25px;

    overflow-x: auto;
}

.filter {

    background: #161b22;

    border: 1px solid #2d333b;

    color: white;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;

    transition: .3s;

    white-space: nowrap;
}

.filter:hover,
.filter.active {

    background: #2563eb;

    border-color: #2563eb;

}


/* =========================
   Tasks
========================= */

#tasksContainer {

    display: flex;

    flex-direction: column;

    gap: 20px;
}

.task-card {

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 12px;

    padding: 20px;

    transition: .3s;
}

.task-card:hover {

    border-color: #2563eb;

    transform: translateY(-3px);

}

.task-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 15px;
}

.task-info {

    min-width: 0;
}

.task-header h3 {

    margin-bottom: 8px;

    word-break: break-word;
}

.task-header p {

    color: #888;

    line-height: 1.6;

    word-break: break-word;
}

.task-completed {

    text-decoration: line-through;

    color: #777 !important;
}


/* =========================
   Priority
========================= */

.priority {

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 13px;

    flex-shrink: 0;
}

.priority.high {

    background: #dc2626;

}

.priority.medium {

    background: #d97706;

}

.priority.low {

    background: #16a34a;

}


/* =========================
   Footer
========================= */

.task-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 20px;

    color: #888;

    gap: 15px;
}

.task-meta {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;
}

.daily-badge {

    color: #3b82f6;
}

.actions {

    display: flex;

    gap: 10px;

    flex-shrink: 0;
}

.actions button {

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    color: white;

    transition: .3s;
}

.complete {

    background: #16a34a;
}

.complete:hover {

    background: #15803d;
}

.complete.completed {

    background: #2563eb;
}

.complete.completed:hover {

    background: #1d4ed8;
}

.complete.daily {

    background: #000;
}

.complete.daily:hover {

    background: #2e2d2d;
}

.delete {

    background: #dc2626;
}

.delete:hover {

    background: #b91c1c;
}


/* =========================
   Empty
========================= */

.empty-tasks {

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 12px;

    padding: 50px 20px;

    text-align: center;

    color: #888;
}

.empty-icon {

    font-size: 40px;

    margin-bottom: 15px;
}

.empty-tasks h3 {

    color: white;

    margin-bottom: 8px;
}


/* =========================
   Modal
========================= */

.modal {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, .65);

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 9999;
}

.modal-content {

    width: 450px;

    max-width: 100%;

    background: #161b22;

    border: 1px solid #2d333b;

    border-radius: 15px;

    padding: 25px;
}

.modal-content h2 {

    margin-bottom: 20px;
}

.modal-content input,
.modal-content textarea,
.modal-content select {

    width: 100%;

    margin-bottom: 15px;

    padding: 12px;

    background: #0d1117;

    border: 1px solid #2d333b;

    color: white;

    border-radius: 8px;

    outline: none;

    font-family: inherit;
}

.modal-content textarea {

    resize: none;

    height: 100px;
}

.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 10px;
}

.modal-buttons button {

    border: none;

    padding: 12px 18px;

    border-radius: 8px;

    cursor: pointer;
}

#cancel {

    background: #333;

    color: white;
}

#saveTask {

    background: #2563eb;

    color: white;
}

#saveTask:hover {

    background: #1d4ed8;
}


/* =========================
   Loading
========================= */

#loading-screen {

    position: fixed;

    inset: 0;

    background: #0c0c0c;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 99999;

    transition: .4s;
}

.loader-logo {

    text-align: center;

    padding: 20px;
}

.loader-circle {

    width: 70px;

    height: 70px;

    border-radius: 50%;

    border: 4px solid #232323;

    border-top: 4px solid #3b82f6;

    animation: spin 1s linear infinite;

    margin: auto;

    margin-bottom: 25px;
}

.loader-logo h2 {

    font-size: 28px;

    margin-bottom: 8px;
}

.loader-logo p {

    color: #888;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

#loading-screen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================
   Mobile
========================= */

@media (max-width: 768px) {

    body {

        display: block;

    }


    /* Sidebar */

    .sidebar {

        position: fixed;

        top: 0;

        right: 0;

        left: 0;

        width: 100%;

        min-width: 0;

        height: auto;

        padding: 7px;

        display: flex;

        align-items: center;

        gap: 5px;

        overflow-x: auto;

        overflow-y: hidden;

        border-left: none;

        border-bottom: 1px solid #222;

    }

    .logo {

        margin: 0;

        padding: 8px;

        font-size: 14px;

        flex-shrink: 0;
    }

    .nav-section {

        display: none;

    }

    .nav-item {

        padding: 9px 11px;

        margin: 0;

        font-size: 13px;

        flex-shrink: 0;

        white-space: nowrap;
    }


    /* Container */

    .container {

        width: 100%;

        margin-right: 0;

        padding: 75px 12px 20px;
    }


    /* Header */

    header {

        flex-direction: column;

        align-items: stretch;

        gap: 15px;

        margin-bottom: 20px;
    }

    header h1 {

        font-size: 23px;

    }

    header p {

        font-size: 13px;

    }

    #openModal {

        width: 100%;

        padding: 13px;
    }


    /* Stats */

    .stats {

        grid-template-columns: 1fr;

        gap: 10px;

        margin-bottom: 15px;
    }

    .stat-card {

        padding: 16px;
    }

    .stat-card h2 {

        font-size: 28px;
    }


    /* Search */

    .search-box {

        margin-bottom: 12px;

    }


    /* Filters */

    .filters {

        margin-bottom: 15px;

        padding-bottom: 3px;
    }


    /* Task */

    .task-card {

        padding: 16px;

    }

    .task-card:hover {

        transform: none;

    }

    .task-header {

        flex-direction: column;

        align-items: stretch;

    }

    .priority {

        align-self: flex-start;

    }

    .task-footer {

        flex-direction: column;

        align-items: stretch;

    }

    .task-meta {

        font-size: 13px;

    }

    .actions {

        width: 100%;

        justify-content: flex-end;

    }


    /* Modal */

    .modal {

        padding: 12px;

    }

    .modal-content {

        width: 100%;

        padding: 20px;

        border-radius: 14px;

    }

    .modal-content h2 {

        font-size: 20px;

    }

}


/* =========================
   Very Small Phones
========================= */

@media (max-width: 400px) {

    .container {

        padding-left: 9px;

        padding-right: 9px;

    }

    .nav-item {

        font-size: 12px;

        padding: 8px 9px;

    }

    .logo {

        font-size: 13px;

    }

    header h1 {

        font-size: 20px;

    }

    .task-card {

        padding: 14px;

    }

    .actions {

        gap: 7px;

    }

    .actions button {

        width: 38px;

        height: 38px;

    }

}
    </style>
    </head>

<body>
    <div id="loading-screen">
    <div class="loader-logo">
        <div class="loader-circle"></div>
        <h2>نظام التنظيم</h2>
        <p>جاري تحميل البيانات</p>
    </div>
</div>
<aside class="sidebar">
    <div class="logo">🏠 التنظيم</div>

    <div class="nav-section">عام</div>

    <a class="nav-item" href="./index.html">🏠 الشاشة الرئيسية</a>
    <a class="nav-item active" >📋 المهام</a>
    <a class="nav-item "href="./notes.html">📝 الملاحظات</a>
    

</aside>
    <div class="container">

        <!-- Header -->

        <header>

            <div>
                <h1>📋 إدارة المهام</h1>
                <p>قم بإدارة جميع مهامك اليومية.</p>
            </div>

            <button id="openModal">
                <i class="fa-solid fa-plus"></i>
                إضافة مهمة
            </button>

        </header>

        <!-- Statistics -->

        <section class="stats">

            <div class="stat-card">
                <span>إجمالي المهام</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>المكتملة</span>
                <h2 id="completedTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>المتبقية</span>
                <h2 id="pendingTasks">0</h2>
            </div>

        </section>

        <!-- Search -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="search"
                placeholder="ابحث عن مهمة...">

        </div>

        <!-- Filters -->

        <div class="filters">

            <button class="filter active" data-filter="all">
                الكل
            </button>

            <button class="filter" data-filter="pending">
                قيد التنفيذ
            </button>

            <button class="filter" data-filter="completed">
                المكتملة
            </button>

        </div>

        <!-- Tasks -->

        <section id="tasksContainer">

            <!-- Task -->

            <div class="task-card">

                <div class="task-header">

                    <div>

                        <h3>إنهاء تصميم Dashboard</h3>

                        <p>تصميم الصفحة الرئيسية للمشروع.</p>

                    </div>

                    <span class="priority high">
                        عالية
                    </span>

                </div>

                <div class="task-footer">

                    <span>
                        <i class="fa-regular fa-calendar"></i>
                        15 يوليو 2026
                    </span>

                    <div class="actions">

                        <button class="complete">
                            <i class="fa-solid fa-check"></i>
                        </button>

                        <button class="edit">
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        <button class="delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </div>

    <!-- Modal -->

    <div class="modal" id="modal">

        <div class="modal-content">

            <h2>إضافة مهمة جديدة</h2>

            <input
                id="title"
                type="text"
                placeholder="اسم المهمة">

            <textarea
                id="description"
                placeholder="الوصف"></textarea>

            <select id="priority">

                <option value="high">عالية</option>

                <option value="medium">متوسطة</option>

                <option value="low">منخفضة</option>

            </select>

            <input
                type="date"
                id="date">

            <div class="modal-buttons">

                <button id="cancel">
                    إلغاء
                </button>

                <button id="saveTask">
                    حفظ المهمة
                </button>

            </div>

        </div>

    </div>
<script src="db.js"></script>
    <script>
let tasks = [];

const modal = document.getElementById("modal");
const openModal = document.getElementById("openModal");
const cancel = document.getElementById("cancel");
const saveTask = document.getElementById("saveTask");

const tasksContainer = document.getElementById("tasksContainer");

const totalTasks = document.getElementById("totalTasks");
const completedTasks = document.getElementById("completedTasks");
const pendingTasks = document.getElementById("pendingTasks");


// =========================
// Modal
// =========================

openModal.onclick = () => {
    modal.style.display = "flex";
};

cancel.onclick = () => {
    modal.style.display = "none";
};


// =========================
// تحميل المهام
// =========================

async function getTasks() {

    tasks = await getAll("tasks");

    renderTasks();
}


// =========================
// الإحصائيات
// =========================

function updateStats() {

    totalTasks.textContent = tasks.length;

    completedTasks.textContent =
        tasks.filter(t => t.completed).length;

    pendingTasks.textContent =
        tasks.filter(t => !t.completed).length;
}


// =========================
// عرض المهام
// =========================

function renderTasks() {

    tasksContainer.innerHTML = "";

    if (tasks.length === 0) {

        tasksContainer.innerHTML = `
            <div class="empty">
                📋
                <h3>لا توجد مهام</h3>
                <p>ابدأ بإضافة أول مهمة لك.</p>
            </div>
        `;

        updateStats();
        return;
    }


    tasks.forEach((task, index) => {

        tasksContainer.innerHTML += `

        <div class="task-card">

            <div class="task-header">

                <div class="task-info">

                    <h3 class="${task.completed ? "task-done" : ""}">
                        ${escapeHTML(task.title)}
                    </h3>

                    <p>
                        ${escapeHTML(task.description || "")}
                    </p>

                </div>

                <span class="priority ${task.priority}">
                    ${getPriorityName(task.priority)}
                </span>

            </div>


            <div class="task-footer">

                <span>
                    📅 ${task.date || "بدون تاريخ"}
                </span>

                ${
                    task.daily
                    ? `<span>🔄 يومية</span>`
                    : ""
                }


                <div class="actions">

                    ${
                        !task.daily
                        ? `
                        <button
                            class="complete ${task.completed ? "completed" : ""}"
                            onclick="completeTask(${index})">

                            <i class="fa-solid ${
                                task.completed
                                ? "fa-check-double"
                                : "fa-check"
                            }"></i>

                        </button>
                        `
                        : ""
                    }


                    <button
                        class="complete ${task.daily ? "daily" : ""}"
                        onclick="dailyTask(${index})">

                        <i class="fa-solid ${
                            task.daily
                            ? "fa-arrows-rotate"
                            : "fa-calendar-day"
                        }"></i>

                    </button>


                    <button
                        class="delete"
                        onclick="deleteTask(${index})">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                </div>

            </div>

        </div>
        `;
    });

    updateStats();
}


// =========================
// إضافة مهمة
// =========================

saveTask.onclick = async () => {

    const title =
        document.getElementById("title").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const priority =
        document.getElementById("priority").value;

    const date =
        document.getElementById("date").value;


    if (!title) return;


    await addItem("tasks", {

        title,

        description,

        priority,

        date,

        completed: false,

        daily: false,

        createdAt: new Date().toISOString()

    });


    modal.style.display = "none";


    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("date").value = "";


    await getTasks();
};


// =========================
// حذف
// =========================

async function deleteTask(index) {

    const task = tasks[index];

    await deleteItem("tasks", task.id);

    await getTasks();
}


// =========================
// إكمال
// =========================

async function completeTask(index) {

    const task = tasks[index];

    task.completed = !task.completed;

    await updateItem("tasks", task);

    await getTasks();
}


// =========================
// مهمة يومية
// =========================

async function dailyTask(index) {

    const task = tasks[index];

    task.daily = !task.daily;

    if (task.daily) {
        task.completed = true;
    }

    await updateItem("tasks", task);

    await getTasks();
}


// =========================
// Helpers
// =========================

function getPriorityName(priority) {

    if (priority === "high") return "عالية";
    if (priority === "medium") return "متوسطة";
    if (priority === "low") return "منخفضة";

    return priority;
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// =========================
// تشغيل
// =========================

window.addEventListener("load", async () => {

    await openDB();

    await getTasks();

    setTimeout(() => {

        document
            .getElementById("loading-screen")
            .classList.add("hide");

    }, 300);

});
    </script>

</body>

</html>
